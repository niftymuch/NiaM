<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nia M.</title>
  <meta name="description" content="Nia M. — living & learning in a naturally beautiful world." />
<style>
:root{color-scheme:light;}
:root {
  --paper:   #dce8dc;   /* sage green background */
  --paper-2: #cfe0cf;
  --ink:     #2b342c;   /* deep green ink */
  --muted:   #5c6b5e;   /* muted green-gray text */
  --line:    #b9ccb9;   /* hairline */
  --sage:    #7d9a7e;   /* green accent */
  --sage-dk: #566f58;
  --rose:    #c2185b;   /* deep pink */
  --rose-dk: #9c1450;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100dvh;
  background:
    radial-gradient(90% 60% at 12% 8%,  rgba(125,154,126,0.16), transparent 60%),
    radial-gradient(80% 55% at 92% 96%, rgba(194,24,91,0.14), transparent 60%),
    var(--paper);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", Cambria, serif;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: 760px;
  min-height: 100dvh;
  margin: 0 auto;
  padding: clamp(1.5rem, 4vh, 3rem) clamp(1.25rem, 5vw, 2.5rem);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: clamp(1.4rem, 3.6vh, 2.6rem);
}

/* ---------- Masthead ---------- */
.title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
}
.name {
  font-family: Georgia, "Times New Roman", Cambria, serif;
  font-weight: 700;
  font-size: clamp(2.8rem, 8vw, 4.6rem);
  line-height: 0.98;
  letter-spacing: -0.02em;
  margin: 0;
}
.bunny {
  height: clamp(150px, 22vh, 220px);
  width: auto;
  flex: 0 0 auto;
  transform: scaleY(-1) scaleX(-1);            /* flipped vertically */
}
.tagline {
  font-family: Georgia, "Times New Roman", Cambria, serif;
  font-style: normal;
  font-weight: 400;
  font-size: clamp(1.1rem, 2.6vw, 1.4rem);
  color: var(--muted);
  margin: 0.9rem 0 0;
}

/* ---------- Intro ---------- */
.intro {
  max-width: 54ch;
  margin: 0;
  font-size: clamp(1rem, 1.6vw, 1.08rem);
}

/* ---------- Section cards ---------- */
.cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(0.75rem, 1.6vw, 1.1rem);
  max-width: 560px;
}
.card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  padding: clamp(1rem, 2.4vh, 1.4rem) 1.15rem clamp(1.1rem, 2.6vh, 1.5rem);
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.35);
  text-decoration: none;
  color: var(--ink);
  transition: transform 0.22s ease, border-color 0.22s ease,
              background 0.22s ease, box-shadow 0.22s ease;
}
.card:hover, .card:focus-visible {
  transform: translateY(-3px);
  border-color: var(--rose);
  background: rgba(255, 255, 255, 0.6);
  box-shadow: 0 10px 24px rgba(156, 20, 80, 0.16);
  outline: none;
}
.card-title {
  font-family: Georgia, "Times New Roman", Cambria, serif;
  font-size: clamp(1.3rem, 2.4vw, 1.55rem);
  font-weight: 700;
  line-height: 1.1;
}
.card-desc {
  color: var(--muted);
  font-size: 0.9rem;
}
.card-arrow {
  position: absolute;
  right: 1rem;
  bottom: 0.9rem;
  color: var(--rose-dk);
  opacity: 0;
  transform: translateX(-4px);
  transition: opacity 0.22s ease, transform 0.22s ease;
}
.card:hover .card-arrow, .card:focus-visible .card-arrow {
  opacity: 1;
  transform: translateX(0);
}

/* ---------- Footer ---------- */
.foot {
  font-size: 0.88rem;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 0.55rem;
  flex-wrap: wrap;
}
.foot a {
  color: var(--rose-dk);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s ease;
}
.foot a:hover { border-color: var(--rose-dk); }
.foot-dot { color: var(--line); }

/* ---------- Motion ---------- */
@media (prefers-reduced-motion: no-preference) {
  .masthead, .intro, .cards, .foot { animation: rise 0.6s ease both; }
  .intro { animation-delay: 0.07s; }
  .cards { animation-delay: 0.14s; }
  .foot  { animation-delay: 0.21s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
}

/* ---------- Small screens ---------- */
@media (max-width: 620px) {
  .wrap { justify-content: flex-start; padding-top: 2rem; gap: 1.3rem; }
  .cards { grid-template-columns: 1fr; gap: 0.6rem; }
  .card {
    flex-direction: row;
    align-items: baseline;
    gap: 0.7rem;
    padding: 0.85rem 1rem;
  }
  .card-desc { margin-left: auto; text-align: right; }
  .card-arrow { display: none; }
  .bunny { height: 110px; }
  .sprig { display: none; }   /* avoid collision with bunny on phones */
}

</style>
</head>
<body>

  <main class="wrap">
    <header class="masthead">
      <div class="title-row">
        <div class="title-text">
          <h1 class="name">Nia&nbsp;M.</h1>
        </div>
        <img class="bunny" src="Bunny.png" alt="Nia's green mechanical bunny" />
      </div>
      <p class="tagline">Living &amp; learning in a naturally beautiful world.</p>
    </header>

    <p class="intro">
      Curious about the natural world and the things people make within it —
      here's my work, my background, and what I'm spending time on.
    </p>

    <nav class="cards" aria-label="Sections">
      <a class="card" href="assets/resume.pdf" target="_blank" rel="noopener">
        <span class="card-title">Resume</span>
        <span class="card-desc">Experience &amp; skills &middot; PDF</span>
        <span class="card-arrow" aria-hidden="true">↗</span>
      </a>
      <!-- TODO: replace href with your booking link (Calendly, Cal.com, etc.) -->
      <a class="card" href="#book" target="_blank" rel="noopener">
        <span class="card-title">Time</span>
        <span class="card-desc">Book a chat</span>
        <span class="card-arrow" aria-hidden="true">↗</span>
      </a>
    </nav>

    <footer class="foot">
      <a href="mailto:niamucher@gmail.com">niamucher@gmail.com</a>
      <span class="foot-dot" aria-hidden="true">·</span>
      <span>&copy; 2026 Nia&nbsp;M.</span>
    </footer>
  </main>
</body>
</html>
</body>
</html>
